<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1b5a9e"/>
      <stop offset="55%" stop-color="#123e70"/>
      <stop offset="100%" stop-color="#06152e"/>
    </radialGradient>
    <radialGradient id="nuc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#93c5fd" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Atome -->
  <g transform="translate(1120 380)" fill="none" stroke="#93c5fd" stroke-opacity="0.55" stroke-width="2.5">
    <ellipse rx="260" ry="90"/>
    <ellipse rx="260" ry="90" transform="rotate(60)"/>
    <ellipse rx="260" ry="90" transform="rotate(120)"/>
    <circle r="22" fill="url(#nuc)" stroke="none"/>
    <circle cx="260" cy="0" r="9" fill="#dbeafe" stroke="none"/>
    <circle cx="-130" cy="0" r="9" fill="#dbeafe" stroke="none" transform="rotate(60) translate(-130 -78)"/>
    <circle r="9" fill="#dbeafe" stroke="none" transform="rotate(120) translate(-80 85)"/>
  </g>

  <!-- Molécule hexagonale (benzène) -->
  <g transform="translate(300 640)" fill="none" stroke="#93c5fd" stroke-opacity="0.5" stroke-width="3">
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45"/>
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" stroke-opacity="0.3"/>
    <g fill="#60a5fa" stroke="none" fill-opacity="0.8">
      <circle cx="0" cy="-90" r="9"/><circle cx="78" cy="-45" r="9"/><circle cx="78" cy="45" r="9"/>
      <circle cx="0" cy="90" r="9"/><circle cx="-78" cy="45" r="9"/><circle cx="-78" cy="-45" r="9"/>
    </g>
  </g>

  <!-- Onde sinusoïdale -->
  <path d="M0 780 Q 100 700 200 780 T 400 780 T 600 780 T 800 780 T 1000 780 T 1200 780 T 1400 780 T 1600 780"
        fill="none" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Formules -->
  <g fill="#dbeafe" fill-opacity="0.35" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="120" y="170" font-size="64">E = mc²</text>
    <text x="520" y="110" font-size="40">ΔxΔp ≥ ħ/2</text>
    <text x="560" y="300" font-size="44">F = ma</text>
    <text x="760" y="780" font-size="40">PV = nRT</text>
    <text x="1180" y="810" font-size="44">ΔG = ΔH − TΔS</text>
    <text x="90" y="420" font-size="40">∇·E = ρ/ε₀</text>
  </g>

  <!-- Étoiles / points -->
  <g fill="#bfdbfe" fill-opacity="0.45">
    <circle cx="240" cy="60" r="3"/><circle cx="880" cy="90" r="2.5"/><circle cx="1400" cy="110" r="3"/>
    <circle cx="700" cy="520" r="2.5"/><circle cx="1500" cy="620" r="3"/><circle cx="420" cy="480" r="2"/>
    <circle cx="960" cy="640" r="2.5"/><circle cx="60" cy="560" r="3"/><circle cx="1320" cy="40" r="2"/>
  </g>
</svg>
